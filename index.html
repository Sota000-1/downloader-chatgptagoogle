<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マルチ動画プレイヤー</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px 20px; background-color: #f4f4f9; }
        h1 { color: #333; }
        .input-area { margin-bottom: 30px; }
        input { width: 60%; max-width: 500px; padding: 12px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; outline: none; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 5px; background-color: #ff4757; color: white; border: none; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #ff6b81; }
        
        #video-container { 
            margin: 0 auto; 
            max-width: 800px; 
            min-height: 450px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        iframe { 
            width: 100%; 
            height: 450px; 
            border: none; 
            border-radius: 10px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
            background-color: black;
        }
        .error { color: #ff4757; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

    <h1>📺 マルチ動画プレイヤー</h1>
    <p>YouTube, ニコニコ, X(Twitter), Vimeo, TikTok, PornhubのURLに対応！</p>
    
    <div class="input-area">
        <input type="text" id="urlInput" placeholder="動画やポストのURLを貼り付け">
        <button onclick="showVideo()">表示する</button>
    </div>

    <!-- ここに動画が表示されます -->
    <div id="video-container"></div>

    <script>
        function showVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const container = document.getElementById('video-container');
            container.innerHTML = ""; // 一旦リセット

            if (!url) {
                container.innerHTML = `<p class="error">URLを入力してください！</p>`;
                return;
            }

            // ==========================================
            // ① X (旧Twitter) の場合の特別処理
            // Xはiframeではなく、公式のウィジェット機能を使って表示します
            // ==========================================
            const xMatch = url.match(/(?:twitter\.com|x\.com)\/(?:#!\/)?(\w+)\/status\/(\d+)/);
            if (xMatch) {
                container.innerHTML = `<blockquote class="twitter-tweet" data-theme="dark"><a href="${url}"></a></blockquote>`;
                // Twitterのスクリプトを読み込んで投稿を展開させる
                if (window.twttr && window.twttr.widgets) {
                    window.twttr.widgets.load(container);
                } else {
                    const script = document.createElement('script');
                    script.src = "https://platform.twitter.com/widgets.js";
                    document.body.appendChild(script);
                }
                return; // Xの場合はここで処理終了
            }

            // ==========================================
            // ② 各サイトのURLから「埋め込み用URL」を作る処理
            // ==========================================
            let embedUrl = "";

 
            const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^#&?]*)/);
            if (ytMatch) embedUrl = `https://www.youtube.com/embed/${ytMatch[1]}`;

    
            const nicoMatch = url.match(/(?:nicovideo\.jp\/watch\/|nico\.ms\/)(sm\d+|so\d+|nm\d+)/);
            if (nicoMatch) embedUrl = `https://embed.nicovideo.jp/watch/${nicoMatch[1]}`;

            const vimeoMatch = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
            if (vimeoMatch) embedUrl = `https://player.vimeo.com/video/${vimeoMatch[1]}`;


            const tiktokMatch = url.match(/tiktok\.com\/.*?video\/(\d+)/);
            if (tiktokMatch) embedUrl = `https://www.tiktok.com/embed/v2/${tiktokMatch[1]}`;

    
            const phMatch = url.match(/pornhub\.com\/view_video\.php\?viewkey=([a-zA-Z0-9]+)/);
            if (phMatch) embedUrl = `https://www.pornhub.com/embed/${phMatch[1]}`;

            // ==========================================
            // ③ iframeで表示する
            // ==========================================
            if (embedUrl) {
                container.innerHTML = `<iframe src="${embedUrl}" allow="fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
            } else {
                container.innerHTML = `<p class="error">対応していないURLか、形式が間違っています😭</p>`;
            }
        }
    </script>

</body>
</html>
